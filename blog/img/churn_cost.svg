<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif"><rect width="780" height="380" fill="#fff"/>
<text x="30" y="30" font-size="13" font-weight="700" fill="#1f2328">Token volume is not dollar cost</text>
<text x="30" y="48" font-size="11" fill="#6b7280">Share of all tokens processed, and share of spend at list prices (cache read 0.1&#215;, cache write 1.25&#215;, output 5&#215; the input rate)</text>
<rect x="170" y="78.0" width="110" height="241.1" fill="#9cc0ea"/>
<text x="225" y="203.5" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">96.9%</text>
<rect x="170" y="319.1" width="110" height="7.7" fill="#d97706"/>
<rect x="170" y="326.8" width="110" height="0.6" fill="#9aa1aa"/>
<rect x="170" y="326.9" width="110" height="1.1" fill="#1a7f37"/>
<text x="225" y="350" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Tokens processed</text>
<rect x="330" y="78.0" width="110" height="152.3" fill="#9cc0ea"/>
<text x="385" y="159.2" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">61.0%</text>
<rect x="330" y="230.3" width="110" height="61.2" fill="#d97706"/>
<text x="385" y="265.9" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">24.5%</text>
<rect x="330" y="291.5" width="110" height="0.6" fill="#9aa1aa"/>
<rect x="330" y="292.0" width="110" height="36.0" fill="#1a7f37"/>
<text x="385" y="315.0" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">14.4%</text>
<text x="385" y="350" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Dollar cost</text>
<path d="M280,320.25 L330,230.5" stroke="#9aa1aa" stroke-dasharray="3 3"/>
<rect x="490" y="85" width="14" height="14" rx="3" fill="#9cc0ea"/><text x="512" y="96" font-size="12" fill="#1f2328">Cache reads</text><text x="640" y="96" font-size="11.5" fill="#6b7280">96.9% &#8594; <tspan font-weight="700" fill="#1f2328">61.0%</tspan></text>
<rect x="490" y="115" width="14" height="14" rx="3" fill="#d97706"/><text x="512" y="126" font-size="12" fill="#1f2328">Cache creation</text><text x="640" y="126" font-size="11.5" fill="#6b7280">3.1% &#8594; <tspan font-weight="700" fill="#1f2328">24.5%</tspan></text>
<rect x="490" y="145" width="14" height="14" rx="3" fill="#9aa1aa"/><text x="512" y="156" font-size="12" fill="#1f2328">Fresh input</text><text x="640" y="156" font-size="11.5" fill="#6b7280">0.03% &#8594; <tspan font-weight="700" fill="#1f2328">0.2%</tspan></text>
<rect x="490" y="175" width="14" height="14" rx="3" fill="#1a7f37"/><text x="512" y="186" font-size="12" fill="#1f2328">Output</text><text x="640" y="186" font-size="11.5" fill="#6b7280">0.45% &#8594; <tspan font-weight="700" fill="#1f2328">14.4%</tspan></text>
<text x="490" y="244" font-size="12.5" font-weight="700" fill="#1f2328">96.9% cache hit rate,</text><text x="490" y="262" font-size="12.5" font-weight="700" fill="#1f2328">only 84.5% cost saving</text>
<text x="490" y="282" font-size="11" fill="#6b7280">Cache writes are 3.1% of tokens but a</text><text x="490" y="297" font-size="11" fill="#6b7280">quarter of spend; output is under 0.5%</text><text x="490" y="312" font-size="11" fill="#6b7280">of tokens but 14.4% of spend.</text>
</svg>